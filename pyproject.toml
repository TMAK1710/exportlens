[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "exportlens"
version = "0.1.0"
description = "Local Blender-to-Unity FBX export consistency reports"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "ExportLens contributors"}]
dependencies = []
keywords = ["blender", "unity", "fbx", "validation", "gamedev"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.scripts]
exportlens = "exportlens.__main__:main"

[project.urls]
Repository = "https://github.com/TMAK1710/exportlens"
Issues = "https://github.com/TMAK1710/exportlens/issues"

[tool.setuptools.packages.find]
include = ["exportlens*"]
